name: API boundary and example build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10'
      - run: python -m pytest tests/test_request_boundary.py -q
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_EXAMPLE_MODE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: cp -r frontend/.next/static frontend/.next/standalone/.next/static
      - run: |
          if [ -d frontend/public ]; then
            cp -r frontend/public frontend/.next/standalone/public
          fi
      - run: python3 tests/browser_mobile.py --serve-build frontend/.next/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-mobile-geometry
          path: /tmp/geospatial-mobile-proof
          retention-days: 7
