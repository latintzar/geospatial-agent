[project]
name = "leo"
version = "1.0.0"
description = "Leo - Geospatial Intelligence Agent (The Bloomberg Terminal for the Physical World)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Puedo Casa Team", email = "team@puedocasa.com"}
]
keywords = ["geospatial", "ai", "agent", "maps", "intelligence", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    
    # AI Integration
    "google-generativeai>=0.8.0",
    
    # Geospatial Core
    "h3>=3.7.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "duckdb>=1.1.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    
    # HTTP & APIs
    "requests>=2.31.0",
    "httpx>=0.27.0",
    
    # Data Processing
    "numpy>=1.24.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.8.0",
    "pycountry>=22.3.5",
    
    # HDX Data Platform
    "hdx-python-api>=6.3.0",
    
    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/puedocasa/leo"
Documentation = "https://github.com/puedocasa/leo#readme"
Repository = "https://github.com/puedocasa/leo"

[project.scripts]
leo-server = "backend.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line too long

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
